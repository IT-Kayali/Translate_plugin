name: Apply v0.12.22 runtime ajax hardening

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-v0.12.22.yml'

permissions:
  contents: write

jobs:
  apply-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Decode and verify patch
        shell: bash
        run: |
          set -euo pipefail
          cat .repo-update/v0.12.22.part-00 | base64 --decode > /tmp/itkt-v0.12.22.patch.gz
          echo 'cdb06bf42dbd491705bd2a10c6fc18a3952eddf01ac73a3e9fde134ff0062986  /tmp/itkt-v0.12.22.patch.gz' | sha256sum -c -
          gzip -dc /tmp/itkt-v0.12.22.patch.gz > /tmp/itkt-v0.12.22.patch
          echo '8180df69f4de1b27f5ea4f4430b75f5f5d4eb57d764495922a3d7486b011994a  /tmp/itkt-v0.12.22.patch' | sha256sum -c -
          git apply --check /tmp/itkt-v0.12.22.patch
          git apply /tmp/itkt-v0.12.22.patch

      - name: Validate version and runtime hardening
        shell: bash
        run: |
          set -euo pipefail
          grep -n 'Version: 0.12.22' it-kayali-translate.php
          grep -n "ITKT_VERSION', '0.12.22'" it-kayali-translate.php
          grep -n 'Stable tag: 0.12.22' readme.txt
          grep -n 'runtimeRefreshPromise' public/assets/frontend.js
          grep -n 'scheduleRefresh: scheduleRuntimeRefresh' public/assets/frontend.js
          grep -n "wc-blocks_updated_cart" public/assets/dynamic-runtime.js
          ! grep -q 'added_to_cart removed_from_cart wc_fragments_refreshed' public/assets/dynamic-runtime.js
          grep -n "Method not allowed" includes/class-itkt-frontend.php
          grep -n "Invalid runtime request" includes/class-itkt-frontend.php
          grep -n 'has_frontend_cart_session_hint' includes/class-itkt-product-translations.php

      - name: PHP 8.2 syntax validation
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Linting $file"
            php -l "$file"
          done < <(find . -name '*.php' -type f -print0)

      - name: JavaScript syntax validation
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done < <(find public admin -name '*.js' -type f -print0)

      - name: Static regression checks
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          front=Path('public/assets/frontend.js').read_text()
          dyn=Path('public/assets/dynamic-runtime.js').read_text()
          php=Path('includes/class-itkt-frontend.php').read_text()
          prod=Path('includes/class-itkt-product-translations.php').read_text()
          assert 'var runtimeRefreshPromise = null;' in front
          assert 'runtimeRefreshQueued = true;' in front
          assert 'scheduleRefresh: scheduleRuntimeRefresh' in front
          assert "wc-blocks_added_to_cart', function(){ scheduleRuntimeRefresh(40);" in front
          assert "['wc-blocks_updated_cart','wc-blocks_updated_checkout']" in dyn
          assert 'added_to_cart removed_from_cart wc_fragments_refreshed' not in dyn
          assert "'GET' !== $method" in php
          assert "'xmlhttprequest' !== $requested_with" in php
          assert "isset( $_GET['lang'] )" in php
          assert 'has_frontend_cart_session_hint' in prod
          assert "if ( ! $this->has_frontend_cart_session_hint() ) { return array(); }" in prod
          print('static regression checks: OK')
          PY

      - name: Commit clean source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .repo-update
          rm -f .github/workflows/apply-v0.12.22.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name 'IT-Kayali'
          git config user.email 'ghaithkayali99@gmail.com'
          git add -A
          git commit -m 'fix: v0.12.22 harden runtime ajax refreshes [skip ci]'
          git push origin HEAD:main
