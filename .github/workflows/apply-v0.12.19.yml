name: Apply v0.12.19 backup restore hardening

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-v0.12.19.yml'

permissions:
  contents: write

jobs:
  apply-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Decode and verify patch
        shell: bash
        run: |
          set -euo pipefail
          cat .repo-update/v0.12.19.part-00 .repo-update/v0.12.19.part-01 .repo-update/v0.12.19.part-02 | base64 --decode > /tmp/itkt-v0.12.19.patch.gz
          echo '2d70cf561a24528f739473580e371ed9770050649bd39db6ddb129c560bdf419  /tmp/itkt-v0.12.19.patch.gz' | sha256sum -c -
          gzip -dc /tmp/itkt-v0.12.19.patch.gz > /tmp/itkt-v0.12.19.patch
          echo '869e55ea45fdf561b9904ecb54ef200daff31663f19fda0bc0139a2a8ee4ba1c  /tmp/itkt-v0.12.19.patch' | sha256sum -c -
          git apply --check /tmp/itkt-v0.12.19.patch
          git apply /tmp/itkt-v0.12.19.patch

      - name: Validate version and hardening
        shell: bash
        run: |
          set -euo pipefail
          grep -n 'Version: 0.12.19' it-kayali-translate.php
          grep -n "ITKT_VERSION', '0.12.19'" it-kayali-translate.php
          grep -n 'Stable tag: 0.12.19' readme.txt
          grep -n 'site_mismatch' includes/class-itkt-backup.php
          grep -n 'validate_string_table_relations' includes/class-itkt-backup.php
          grep -n "ITKT_Strings::install_schema();" includes/class-itkt-backup.php

      - name: PHP 8.2 syntax validation
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Linting $file"
            php -l "$file"
          done < <(find . -name '*.php' -type f -print0)

      - name: JavaScript syntax validation
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done < <(find public admin -name '*.js' -type f -print0)

      - name: Commit clean source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .repo-update
          rm -f .github/workflows/apply-v0.12.19.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name 'IT-Kayali'
          git config user.email 'ghaithkayali99@gmail.com'
          git add -A
          git commit -m 'fix: v0.12.19 harden backup restore safety [skip ci]'
          git push origin HEAD:main
