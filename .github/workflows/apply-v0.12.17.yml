name: Apply v0.12.17 final acceptance

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-v0.12.17.yml'

permissions:
  contents: write

jobs:
  apply-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Decode and verify patch
        shell: bash
        run: |
          set -euo pipefail
          cat .repo-update/v0.12.17.part-00 .repo-update/v0.12.17.part-01 | base64 --decode > /tmp/itkt-v0.12.17.patch.gz
          echo 'abb7c8603599fb4d83fb83382c58dd6b79d4c526f5f9c2ce1762ef464e3fe39d  /tmp/itkt-v0.12.17.patch.gz' | sha256sum -c -
          gzip -dc /tmp/itkt-v0.12.17.patch.gz > /tmp/itkt-v0.12.17.patch
          echo '709bb89f67e0d61c03b7fe48299043c4d1e1127aedf252e2de169257f81d9cf9  /tmp/itkt-v0.12.17.patch' | sha256sum -c -
          git apply --check /tmp/itkt-v0.12.17.patch
          git apply /tmp/itkt-v0.12.17.patch

      - name: Validate version and acceptance assistant
        shell: bash
        run: |
          set -euo pipefail
          grep -n 'Version: 0.12.17' it-kayali-translate.php
          grep -n "ITKT_VERSION', '0.12.17'" it-kayali-translate.php
          grep -n 'Stable tag: 0.12.17' readme.txt
          grep -n 'acceptance_catalog' includes/class-itkt-diagnostics.php
          grep -n 'export_acceptance' includes/class-itkt-admin.php

      - name: PHP 8.2 syntax validation
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Linting $file"
            php -l "$file"
          done < <(find . -name '*.php' -type f -print0)

      - name: JavaScript syntax validation
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done < <(find public admin -name '*.js' -type f -print0)

      - name: Commit clean source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .repo-update
          rm -f .github/workflows/apply-v0.12.17.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name 'IT-Kayali'
          git config user.email 'ghaithkayali99@gmail.com'
          git add -A
          git commit -m 'feat: v0.12.17 final production acceptance assistant [skip ci]'
          git push origin HEAD:main
