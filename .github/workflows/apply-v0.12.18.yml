name: Apply v0.12.18 production consistency

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-v0.12.18.yml'

permissions:
  contents: write

jobs:
  apply-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Decode and verify patch
        shell: bash
        run: |
          set -euo pipefail
          cat .repo-update/v0.12.18.part-00 .repo-update/v0.12.18.part-01 | base64 --decode > /tmp/itkt-v0.12.18.patch.gz
          echo 'ac56cbf72583e3c9af83de8a861ef79b96bb63612879fe7b533eef44ffc3da7b  /tmp/itkt-v0.12.18.patch.gz' | sha256sum -c -
          gzip -dc /tmp/itkt-v0.12.18.patch.gz > /tmp/itkt-v0.12.18.patch
          echo '9eb44020818a17b66b1c85ebcab4515aa93287025287186a59a6fe4e67d1d33d  /tmp/itkt-v0.12.18.patch' | sha256sum -c -
          git apply --check /tmp/itkt-v0.12.18.patch
          git apply /tmp/itkt-v0.12.18.patch

      - name: Validate version and diagnostics
        shell: bash
        run: |
          set -euo pipefail
          grep -n 'Version: 0.12.18' it-kayali-translate.php
          grep -n "ITKT_VERSION', '0.12.18'" it-kayali-translate.php
          grep -n 'Stable tag: 0.12.18' readme.txt
          grep -n 'frontend_translation_coverage' includes/class-itkt-diagnostics.php
          grep -n 'Runtime aktiv:' includes/class-itkt-admin.php

      - name: PHP 8.2 syntax validation
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Linting $file"
            php -l "$file"
          done < <(find . -name '*.php' -type f -print0)

      - name: JavaScript syntax validation
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done < <(find public admin -name '*.js' -type f -print0)

      - name: Commit clean source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .repo-update
          rm -f .github/workflows/apply-v0.12.18.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name 'IT-Kayali'
          git config user.email 'ghaithkayali99@gmail.com'
          git add -A
          git commit -m 'feat: v0.12.18 production consistency and coverage [skip ci]'
          git push origin HEAD:main
