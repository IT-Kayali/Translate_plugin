name: Apply v0.12.23 activation duplicate hardening

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-v0.12.23.yml'

permissions:
  contents: write

jobs:
  apply-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Apply v0.12.23 source and documentation changes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          main = Path('it-kayali-translate.php')
          s = main.read_text()
          s = s.replace(' * Version: 0.12.22', ' * Version: 0.12.23', 1)

          old = """if ( ! defined( 'ABSPATH' ) ) { exit; }
          define( 'ITKT_VERSION', '0.12.22' );
          define( 'ITKT_FILE', __FILE__ );
          define( 'ITKT_DIR', plugin_dir_path( __FILE__ ) );
          define( 'ITKT_URL', plugin_dir_url( __FILE__ ) );
          define( 'ITKT_BASENAME', plugin_basename( __FILE__ ) );

          """
          new = """if ( ! defined( 'ABSPATH' ) ) { exit; }

          /*
           * Duplicate-copy safety.
           *
           * A GitHub source archive is extracted by WordPress as e.g. Translate_plugin-main while an
           * existing installable build may already live in it-kayali-translate/. Loading both copies used
           * to redefine ITKT_* constants and could make the second copy require files from the first
           * directory. Detect the collision before loading any classes so the admin can remove the
           * duplicate safely instead of receiving a fatal error.
           */
          $itkt_bootstrap_file = wp_normalize_path( __FILE__ );
          $itkt_existing_file  = defined( 'ITKT_FILE' ) ? wp_normalize_path( (string) ITKT_FILE ) : '';
          if ( $itkt_existing_file && $itkt_existing_file !== $itkt_bootstrap_file ) {
              add_action( 'admin_notices', static function() use ( $itkt_existing_file, $itkt_bootstrap_file ) {
                  if ( ! current_user_can( 'activate_plugins' ) ) { return; }
                  echo '<div class="notice notice-error"><p><strong>IT-Kayali Translate:</strong> '
                      . esc_html__( 'A second copy of the plugin is installed/active. Deactivate or remove the duplicate copy and install the official plugin ZIP so only one IT-Kayali Translate folder is loaded.', 'it-kayali-translate' )
                      . '</p><p><code>' . esc_html( $itkt_existing_file ) . '</code><br><code>' . esc_html( $itkt_bootstrap_file ) . '</code></p></div>';
              } );
              return;
          }

          // A second include of the same plugin in one request must be harmless.
          if ( class_exists( 'ITKT_Plugin', false ) ) { return; }

          if ( ! defined( 'ITKT_VERSION' ) ) { define( 'ITKT_VERSION', '0.12.23' ); }
          if ( ! defined( 'ITKT_FILE' ) ) { define( 'ITKT_FILE', __FILE__ ); }
          if ( ! defined( 'ITKT_DIR' ) ) { define( 'ITKT_DIR', plugin_dir_path( __FILE__ ) ); }
          if ( ! defined( 'ITKT_URL' ) ) { define( 'ITKT_URL', plugin_dir_url( __FILE__ ) ); }
          if ( ! defined( 'ITKT_BASENAME' ) ) { define( 'ITKT_BASENAME', plugin_basename( __FILE__ ) ); }

          // Always load this copy's files from its own physical directory; never trust a pre-existing path constant.
          $itkt_bootstrap_dir = plugin_dir_path( __FILE__ );

          """
          if old not in s:
              raise SystemExit('Expected v0.12.22 bootstrap block not found')
          s = s.replace(old, new, 1)
          s = s.replace("require_once ITKT_DIR . '", "require_once $itkt_bootstrap_dir . '")
          main.write_text(s)

          # README.md
          p = Path('README.md')
          s = p.read_text()
          s = s.replace('**Current development version: v0.12.22**','**Current development version: v0.12.23**',1)
          s = s.replace(
              '- v0.12.22 is the current production-finalization candidate; it coalesces WooCommerce runtime refreshes and hardens the public read-only runtime endpoint against unnecessary session work.',
              '- v0.12.23 is the current production-finalization candidate; it prevents duplicate plugin copies from causing constant/path collisions during activation and keeps the canonical installable folder isolated.'
          )
          section = """## v0.12.23 – duplicate-installation / activation hardening

          - Prevents a second IT-Kayali Translate copy from redefining `ITKT_*` constants and crashing activation.
          - Detects when two physical plugin copies are loaded (for example `it-kayali-translate/` plus GitHub's `Translate_plugin-main/`) and stops the duplicate copy before class loading.
          - Shows administrators a clear duplicate-copy notice with both physical plugin paths instead of producing a fatal `require_once` error.
          - Core includes are resolved from the current plugin file's own physical directory, so a stale `ITKT_DIR` from another copy can no longer redirect includes into the wrong folder.
          - Re-including the same plugin copy in one request is harmless.
          - The official installable ZIP continues to use the canonical root folder `it-kayali-translate/`.

          ### Installation note

          Do **not** use GitHub **Code → Download ZIP** as a second WordPress plugin installation while an older IT-Kayali Translate copy is still installed. GitHub names that source folder `Translate_plugin-main`, which WordPress treats as a separate plugin directory. For WordPress updates use the installable release ZIP whose root folder is `it-kayali-translate/`; WordPress can then replace the existing copy instead of creating a duplicate.

          ### Validation

          - PHP syntax validation passes for all plugin PHP files.
          - JavaScript syntax validation passes for all bundled JavaScript files.
          - Duplicate-copy bootstrap regression checks verify that the collision guard executes before class includes and that includes use the local bootstrap directory.
          - Real-site activation/update verification is still required before marking v0.12.23 production-confirmed.

          """
          if '## v0.12.23 – duplicate-installation / activation hardening' not in s:
              s = s.replace('## v0.12.21 – safe language-switch query state\n', section + '## v0.12.21 – safe language-switch query state\n', 1)

          old_install = """1. Upload the plugin ZIP under Plugins -> Add Plugin -> Upload Plugin.
          2. Activate IT-Kayali Translate.
          3. Complete the setup assistant and activate the required languages/modules.
          4. After routing-related updates, clear page/server caches and resave Settings -> Permalinks if required.
          5. Test default and non-default languages separately.
          """
          new_install = """1. Upload the **installable IT-Kayali Translate ZIP** under Plugins -> Add Plugin -> Upload Plugin. Its root folder must be `it-kayali-translate/`.
          2. If WordPress reports that the plugin already exists, choose the normal replacement/update option instead of installing a second folder.
          3. Do not upload GitHub **Code -> Download ZIP** as a second copy; GitHub extracts it as `Translate_plugin-main/` and WordPress treats that as a separate plugin directory.
          4. Activate IT-Kayali Translate.
          5. Complete the setup assistant and activate the required languages/modules.
          6. After routing-related updates, clear page/server caches and resave Settings -> Permalinks if required.
          7. Test default and non-default languages separately.
          """
          if old_install in s:
              s = s.replace(old_install, new_install, 1)
          p.write_text(s)

          # CHANGELOG.md
          p = Path('CHANGELOG.md')
          s = p.read_text()
          s = s.replace('Current development version: **0.12.22**.','Current development version: **0.12.23**.',1)
          entry = """## [0.12.23]

          ### Duplicate installation / activation hardening
          - Added an early bootstrap collision guard when a second physical IT-Kayali Translate copy is loaded.
          - Duplicate copies no longer redefine `ITKT_VERSION`, `ITKT_FILE`, `ITKT_DIR`, `ITKT_URL` or `ITKT_BASENAME`.
          - A duplicate copy stops before class loading and shows administrators a clear notice with both plugin paths.
          - Includes now resolve from the current plugin file's own physical directory instead of trusting a potentially stale `ITKT_DIR` from another copy.
          - Re-including the same physical plugin copy in one request is harmless.
          - Documented that GitHub `Code -> Download ZIP` is a source archive (`Translate_plugin-main/`) and should not be installed as a second WordPress copy; production updates use the canonical installable ZIP (`it-kayali-translate/`).

          ### Validation
          - PHP and JavaScript syntax checks pass.
          - Bootstrap regression checks verify early duplicate detection, guarded constants and local-path includes.
          - Real WordPress replacement/activation remains required before production confirmation.

          """
          if '## [0.12.23]' not in s:
              s = s.replace('## [0.12.22]\n', entry + '## [0.12.22]\n', 1)
          p.write_text(s)

          # AGENDA.md
          p = Path('AGENDA.md')
          s = p.read_text()
          s = s.replace('**Aktueller Entwicklungsstand: v0.12.22 – Produktionskandidat / finale Abnahme**','**Aktueller Entwicklungsstand: v0.12.23 – Produktionskandidat / finale Abnahme**',1)
          s = s.replace('**Letzte Aktualisierung: 18.09.2026**','**Letzte Aktualisierung: 19.09.2026**',1)
          agenda = """### Produktions-Härtung v0.12.23 – doppelte Plugin-Kopien / Aktivierung

          - Erkennt zwei gleichzeitig geladene physische IT-Kayali-Translate-Kopien vor dem Laden der Klassen.
          - Verhindert dadurch doppelte `ITKT_*`-Konstanten und falsche Include-Pfade zwischen `it-kayali-translate/` und z. B. `Translate_plugin-main/`.
          - Zeigt Administratoren stattdessen einen verständlichen Hinweis mit beiden Plugin-Pfaden.
          - Alle Includes werden aus dem eigenen physischen Plugin-Verzeichnis geladen und nicht aus einer möglicherweise alten fremden `ITKT_DIR`-Konstante.
          - Installationsregel dokumentiert: GitHub-Source-ZIP nicht als zweite WordPress-Kopie installieren; für Updates die installierbare ZIP mit Root `it-kayali-translate/` verwenden.
          - Realtest bleibt nötig: bestehende Installation per WordPress-Ersetzen auf v0.12.23 aktualisieren und einmal aktivieren.

          """
          if '### Produktions-Härtung v0.12.23' not in s:
              s = s.replace('### Produktions-Härtung v0.12.22 – Runtime/AJAX\n', agenda + '### Produktions-Härtung v0.12.22 – Runtime/AJAX\n', 1)
          p.write_text(s)

          # WordPress readme.txt
          p = Path('readme.txt')
          s = p.read_text()
          s = s.replace('Stable tag: 0.12.22','Stable tag: 0.12.23',1)
          entry = """= 0.12.23 =
          * Prevents fatal activation errors when two physical IT-Kayali Translate copies are loaded.
          * Duplicate copies stop before class loading and no longer redefine ITKT constants.
          * Includes are resolved from the current plugin file's own directory, preventing stale cross-folder ITKT_DIR paths.
          * Shows administrators a duplicate-copy notice instead of a fatal require_once error.
          * Documents that GitHub Code -> Download ZIP is a source archive; WordPress updates should use the installable ZIP with root folder it-kayali-translate/.

          """
          if '= 0.12.23 =' not in s:
              s = s.replace('= 0.12.22 =\n', entry + '= 0.12.22 =\n', 1)

          old_install = """1. Upload the plugin ZIP under Plugins -> Add Plugin -> Upload Plugin.
          2. Activate IT-Kayali Translate.
          3. Complete the setup assistant and activate the required languages/modules.
          4. After routing-related updates, clear page/server caches and resave Settings -> Permalinks if required.
          5. Test default and non-default languages separately.
          """
          new_install = """1. Upload the installable plugin ZIP under Plugins -> Add Plugin -> Upload Plugin. Its root folder is it-kayali-translate/.
          2. If WordPress detects an existing installation, replace/update that copy instead of installing another plugin directory.
          3. Do not install GitHub Code -> Download ZIP as a second WordPress copy; GitHub names that source directory Translate_plugin-main/.
          4. Activate IT-Kayali Translate.
          5. Complete the setup assistant and activate the required languages/modules.
          6. After routing-related updates, clear page/server caches and resave Settings -> Permalinks if required.
          7. Test default and non-default languages separately.
          """
          if old_install in s:
              s = s.replace(old_install, new_install, 1)
          p.write_text(s)
          PY

      - name: Validate version and duplicate-copy hardening
        shell: bash
        run: |
          set -euo pipefail
          grep -n 'Version: 0.12.23' it-kayali-translate.php
          grep -n "ITKT_VERSION', '0.12.23'" it-kayali-translate.php
          grep -n 'Stable tag: 0.12.23' readme.txt
          grep -n 'Current development version: v0.12.23' README.md
          grep -n 'Current development version: \*\*0.12.23\*\*' CHANGELOG.md
          grep -n 'Aktueller Entwicklungsstand: v0.12.23' AGENDA.md
          grep -n 'Duplicate-copy safety' it-kayali-translate.php
          ! grep -q "require_once ITKT_DIR" it-kayali-translate.php
          grep -q "require_once \$itkt_bootstrap_dir" it-kayali-translate.php

      - name: PHP 8.2 syntax validation
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Linting $file"
            php -l "$file"
          done < <(find . -name '*.php' -type f -print0)

      - name: JavaScript syntax validation
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done < <(find public admin -name '*.js' -type f -print0)

      - name: Duplicate bootstrap regression
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/test-itkt-duplicate.php <<'PHP'
          <?php
          error_reporting(E_ALL);
          ini_set('display_errors','1');
          define('ABSPATH','/tmp/wp/');
          define('ITKT_VERSION','0.1.0');
          define('ITKT_FILE','/tmp/wp/wp-content/plugins/it-kayali-translate/it-kayali-translate.php');
          define('ITKT_DIR','/tmp/wp/wp-content/plugins/it-kayali-translate/');
          define('ITKT_URL','https://example.test/wp-content/plugins/it-kayali-translate/');
          define('ITKT_BASENAME','it-kayali-translate/it-kayali-translate.php');
          $GLOBALS['hooks']=array();
          function wp_normalize_path($p){ return str_replace('\\','/',$p); }
          function add_action($hook,$cb){ $GLOBALS['hooks'][$hook][]=$cb; }
          function current_user_can($cap){ return true; }
          function esc_html__($s,$d=null){ return $s; }
          function esc_html($s){ return htmlspecialchars($s,ENT_QUOTES,'UTF-8'); }
          include __DIR__ . '/it-kayali-translate.php';
          if (!isset($GLOBALS['hooks']['admin_notices'][0])) { fwrite(STDERR,"missing duplicate notice hook\n"); exit(1); }
          ob_start(); ($GLOBALS['hooks']['admin_notices'][0])(); $notice=ob_get_clean();
          if (strpos($notice,'second copy')===false) { fwrite(STDERR,"notice missing\n"); exit(1); }
          echo "duplicate guard OK\n";
          PHP
          cp it-kayali-translate.php /tmp/it-kayali-translate.php
          (cd /tmp && php test-itkt-duplicate.php)

      - name: Commit clean source
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-v0.12.23.yml
          git config user.name 'IT-Kayali'
          git config user.email 'ghaithkayali99@gmail.com'
          git add -A
          git commit -m 'fix: v0.12.23 harden duplicate plugin activation [skip ci]'
          git push origin HEAD:main
