name: Import plugin source v0.12.8

on:
  push:
    paths:
      - "source/v0.12.8/READY"

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Rebuild and extract plugin source
        shell: bash
        run: |
          set -euo pipefail

          rm -rf /tmp/itkt-import
          mkdir -p /tmp/itkt-import

          cat source/v0.12.8/part-* > /tmp/itkt-v0.12.8.tar.xz.b64
          base64 --decode /tmp/itkt-v0.12.8.tar.xz.b64 > /tmp/itkt-v0.12.8.tar.xz

          echo "a48d2a2de6e25569714bc012f2a44b1c08c44b83a1f12e22f4335d8ece762b17  /tmp/itkt-v0.12.8.tar.xz" | sha256sum -c -

          tar -xJf /tmp/itkt-v0.12.8.tar.xz -C /tmp/itkt-import
          test -f /tmp/itkt-import/it-kayali-translate/it-kayali-translate.php

          rm -rf admin includes public
          rm -f it-kayali-translate.php readme.txt uninstall.php

          cp -a /tmp/itkt-import/it-kayali-translate/admin .
          cp -a /tmp/itkt-import/it-kayali-translate/includes .
          cp -a /tmp/itkt-import/it-kayali-translate/public .
          cp /tmp/itkt-import/it-kayali-translate/it-kayali-translate.php .
          cp /tmp/itkt-import/it-kayali-translate/readme.txt .
          cp /tmp/itkt-import/it-kayali-translate/uninstall.php .

      - name: Verify plugin version and PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          grep -q "Version: 0.12.8" it-kayali-translate.php
          grep -q "ITKT_VERSION', '0.12.8'" it-kayali-translate.php
          grep -q "Stable tag: 0.12.8" readme.txt
          find . -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null

      - name: Commit imported v0.12.8 source
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add admin includes public it-kayali-translate.php readme.txt uninstall.php
          git rm -rf source/v0.12.7 source/v0.12.8
          git rm -f .github/workflows/import-plugin-source.yml

          git commit -m "chore: import IT-Kayali Translate v0.12.8 source"
          git push
