name: Apply v0.12.21 routing action replay hardening

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-v0.12.21.yml'

permissions:
  contents: write

jobs:
  apply-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Decode and verify patch
        shell: bash
        run: |
          set -euo pipefail
          cat .repo-update/v0.12.21.part-00 .repo-update/v0.12.21.part-01 | base64 --decode > /tmp/itkt-v0.12.21.patch.gz
          echo 'e32de6abc8d4b75bbc7d253c978eaed726b9416711c4763356a70d0016262c1b  /tmp/itkt-v0.12.21.patch.gz' | sha256sum -c -
          gzip -dc /tmp/itkt-v0.12.21.patch.gz > /tmp/itkt-v0.12.21.patch
          echo '21b9e4f3aa5da62f3b6e59223635ca3fc2d7e7f334f3de7445f3d7d1c75e35b3  /tmp/itkt-v0.12.21.patch' | sha256sum -c -
          git apply --check /tmp/itkt-v0.12.21.patch
          git apply /tmp/itkt-v0.12.21.patch

      - name: Validate version and routing hardening
        shell: bash
        run: |
          set -euo pipefail
          grep -n 'Version: 0.12.21' it-kayali-translate.php
          grep -n "ITKT_VERSION', '0.12.21'" it-kayali-translate.php
          grep -n 'Stable tag: 0.12.21' readme.txt
          grep -n 'function language_switch_query_args' includes/class-itkt-frontend.php
          grep -n 'itkt_language_switch_query_args' includes/class-itkt-frontend.php
          grep -n "is_cart()" includes/class-itkt-seo.php
          grep -n "is_checkout()" includes/class-itkt-seo.php
          grep -n "is_account_page()" includes/class-itkt-seo.php

      - name: PHP 8.2 syntax validation
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Linting $file"
            php -l "$file"
          done < <(find . -name '*.php' -type f -print0)

      - name: JavaScript syntax validation
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done < <(find public admin -name '*.js' -type f -print0)

      - name: Commit clean source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .repo-update
          rm -f .github/workflows/apply-v0.12.21.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name 'IT-Kayali'
          git config user.email 'ghaithkayali99@gmail.com'
          git add -A
          git commit -m 'fix: v0.12.21 harden language-switch routing [skip ci]'
          git push origin HEAD:main
