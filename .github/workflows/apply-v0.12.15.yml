name: Apply v0.12.15 default-language overrides

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-v0.12.15.yml'

permissions:
  contents: write

jobs:
  apply-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Decode and verify patch
        shell: bash
        run: |
          set -euo pipefail
          cat .repo-update/v0.12.15.part-00 .repo-update/v0.12.15.part-01 | base64 --decode > /tmp/itkt-v0.12.15.patch.gz
          echo '62bd4dbb242ba8e3f07753f6dd4fdbd65e1385dc2c0e615f70ae186fdcb09fbe  /tmp/itkt-v0.12.15.patch.gz' | sha256sum -c -
          gzip -dc /tmp/itkt-v0.12.15.patch.gz > /tmp/itkt-v0.12.15.patch
          echo 'f9f50fcbb7ed562dc0aea8b3aef0bdfc5953513e63b24b05de1983d94b2181b6  /tmp/itkt-v0.12.15.patch' | sha256sum -c -
          git apply --check /tmp/itkt-v0.12.15.patch
          git apply /tmp/itkt-v0.12.15.patch

      - name: Validate version and source
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'Version: 0.12.15' it-kayali-translate.php
          grep -q "ITKT_VERSION', '0.12.15'" it-kayali-translate.php
          grep -q 'Stable tag: 0.12.15' readme.txt
          grep -q 'Standardsprache überschreiben' includes/class-itkt-frontend-catalog.php
          find . -name '*.php' -type f -print0 | xargs -0 -n1 php -l >/tmp/itkt-php-lint.txt
          find public admin -name '*.js' -type f -print0 | xargs -0 -n1 node --check

      - name: Commit clean source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .repo-update
          rm -f .github/workflows/apply-v0.12.15.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name 'IT-Kayali'
          git config user.email 'ghaithkayali99@gmail.com'
          git add -A
          git commit -m 'feat: v0.12.15 default-language frontend overrides [skip ci]'
          git push origin HEAD:main
