name: Apply v0.12.24 taxonomy archive recursion fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-v0.12.24.yml'

permissions:
  contents: write

jobs:
  apply-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Apply source and docs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          p=Path('includes/class-itkt-languages.php')
          s=p.read_text()
          old="""        if ( ! $code && ! is_admin() && function_exists( 'get_queried_object_id' ) ) {
              $queried_id = absint( get_queried_object_id() );
              if ( $queried_id ) { $code = sanitize_key( (string) get_post_meta( $queried_id, '_itkt_language', true ) ); }
          }
          """
          new="""        // Only singular posts/pages/products own the _itkt_language post meta. On taxonomy
          // archives get_queried_object_id() may build the queried WP_Term via get_term(). Because
          // ITKT also filters get_term() and that filter calls current_code(), doing this lookup on
          // a category/tag archive can recurse until PHP exhausts memory and returns HTTP 500.
          if ( ! $code && ! is_admin() && function_exists( 'is_singular' ) && is_singular() && function_exists( 'get_queried_object_id' ) ) {
              $queried_id = absint( get_queried_object_id() );
              if ( $queried_id ) { $code = sanitize_key( (string) get_post_meta( $queried_id, '_itkt_language', true ) ); }
          }
          """
          if old not in s: raise SystemExit('language fallback block not found')
          p.write_text(s.replace(old,new,1))

          p=Path('it-kayali-translate.php')
          s=p.read_text().replace(' * Version: 0.12.23',' * Version: 0.12.24',1).replace("ITKT_VERSION', '0.12.23'","ITKT_VERSION', '0.12.24'",1)
          p.write_text(s)

          p=Path('README.md'); s=p.read_text()
          s=s.replace('**Current development version: v0.12.23**','**Current development version: v0.12.24**',1)
          s=s.replace('- v0.12.23 is the current production-finalization candidate; it prevents duplicate plugin copies from causing constant/path collisions during activation and keeps the canonical installable folder isolated.', '- v0.12.24 is the current production-finalization candidate; it fixes the WooCommerce product category/tag archive HTTP 500 caused by recursive language detection while WordPress is building the queried term.')
          section="""## v0.12.24 – WooCommerce category/tag archive 500 fix

          - Fixes HTTP 500 errors when opening WooCommerce product category and product tag archives such as `/product-category/baklava/` and `/product-tag/.../`.
          - The root cause was recursive language detection: `current_code()` called `get_queried_object_id()` on taxonomy requests while WordPress was still building the queried `WP_Term`; ITKT's `get_term` translation filter then called `current_code()` again.
          - The `_itkt_language` post-meta fallback now runs only on real singular requests (pages/posts/products), where that metadata actually belongs.
          - Taxonomy archives now stay on the normal term-language path and no longer enter the queried-object recursion.
          - This change is intentionally narrow and does not alter translated category/tag names, slugs, SEO, filters or language-switch URLs.

          ### Validation

          - PHP syntax validation passes for all plugin PHP files.
          - JavaScript syntax validation passes for all bundled JavaScript files.
          - A taxonomy recursion regression harness verifies that `current_code()` does not call `get_queried_object_id()` when `is_singular()` is false.
          - Real-site category/tag verification is still required before v0.12.24 is marked production-confirmed.

          """
          if '## v0.12.24 – WooCommerce category/tag archive 500 fix' not in s:
              s=s.replace('## v0.12.23 – duplicate-installation / activation hardening\n',section+'## v0.12.23 – duplicate-installation / activation hardening\n',1)
          p.write_text(s)

          p=Path('CHANGELOG.md'); s=p.read_text()
          s=s.replace('Current development version: **0.12.23**.','Current development version: **0.12.24**.',1)
          entry="""## [0.12.24]

          ### WooCommerce taxonomy archive fatal fix
          - Fixed HTTP 500 errors on WooCommerce product category and product tag archives.
          - `ITKT_Languages::current_code()` no longer asks WordPress for a queried object ID on taxonomy archives.
          - The post-meta language fallback is now limited to singular requests, which is the only place `_itkt_language` post metadata is valid.
          - This prevents recursion between taxonomy queried-object construction, the ITKT `get_term` filter and `current_code()`.

          ### Validation
          - PHP and JavaScript syntax checks pass.
          - Taxonomy recursion regression test verifies that non-singular requests never call `get_queried_object_id()` from `current_code()`.
          - Real WooCommerce category/tag browser verification remains required before production confirmation.

          """
          if '## [0.12.24]' not in s: s=s.replace('## [0.12.23]\n',entry+'## [0.12.23]\n',1)
          p.write_text(s)

          p=Path('AGENDA.md'); s=p.read_text()
          s=s.replace('**Aktueller Entwicklungsstand: v0.12.23 – Produktionskandidat / finale Abnahme**','**Aktueller Entwicklungsstand: v0.12.24 – Produktionskandidat / finale Abnahme**',1)
          agenda="""### Produktions-Fix v0.12.24 – Produktkategorie/Tag HTTP 500

          - Behebt den HTTP-500-Fehler beim Aufruf von WooCommerce-Produktkategorien und Produkt-Tags.
          - Ursache: rekursive Spracherkennung während WordPress das angefragte `WP_Term` aufbaut (`get_queried_object_id()` → `get_term`-Filter → `current_code()` → erneut `get_queried_object_id()`).
          - Der `_itkt_language`-Postmeta-Fallback läuft jetzt ausschließlich bei echten Singular-Requests (Seiten/Beiträge/Produkte), nicht bei Taxonomien.
          - Übersetzte Kategorien/Tags, Slugs, SEO und Sprachwechsel bleiben unverändert.
          - Realtest offen: mindestens eine Produktkategorie und einen Produkt-Tag in DE sowie anschließend EN/AR öffnen.

          """
          if '### Produktions-Fix v0.12.24' not in s:
              s=s.replace('### Produktions-Härtung v0.12.23 – doppelte Plugin-Kopien / Aktivierung\n',agenda+'### Produktions-Härtung v0.12.23 – doppelte Plugin-Kopien / Aktivierung\n',1)
          p.write_text(s)

          p=Path('readme.txt'); s=p.read_text()
          s=s.replace('Stable tag: 0.12.23','Stable tag: 0.12.24',1)
          entry="""= 0.12.24 =
          * Fixes HTTP 500 errors on WooCommerce product category and product tag archives.
          * Prevents recursive language detection while WordPress builds the queried taxonomy term.
          * Limits the _itkt_language post-meta fallback to singular requests where post metadata is valid.
          * Keeps translated taxonomy names, slugs, SEO and language switching unchanged.

          """
          if '= 0.12.24 =' not in s: s=s.replace('= 0.12.23 =\n',entry+'= 0.12.23 =\n',1)
          p.write_text(s)
          PY

      - name: Validate version/docs
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'Version: 0.12.24' it-kayali-translate.php
          grep -q "ITKT_VERSION', '0.12.24'" it-kayali-translate.php
          grep -q 'Stable tag: 0.12.24' readme.txt
          grep -q 'Current development version: v0.12.24' README.md
          grep -q 'Current development version: \*\*0.12.24\*\*' CHANGELOG.md
          grep -q 'Aktueller Entwicklungsstand: v0.12.24' AGENDA.md

      - name: PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' f; do php -l "$f" >/dev/null; done < <(find . -name '*.php' -type f -print0)

      - name: JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' f; do node --check "$f" >/dev/null; done < <(find public admin -name '*.js' -type f -print0)

      - name: Taxonomy recursion regression
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/itkt-tax-test.php <<'PHP'
          <?php
          define('ABSPATH','/tmp/wp/');
          $GLOBALS['queried_calls']=0;
          function get_option($key,$default=array()){ if($key==='itkt_languages')return array('de'=>array('active'=>true,'default'=>true)); if($key==='itkt_settings')return array('default_language'=>'de'); if($key==='home'||$key==='siteurl')return 'https://example.test'; return $default; }
          function sanitize_key($s){return strtolower(preg_replace('/[^a-z0-9_-]/','',(string)$s));}
          function wp_unslash($v){return $v;}
          function wp_parse_url($u,$c=-1){return parse_url($u,$c);}
          function is_admin(){return false;}
          function wp_doing_ajax(){return false;}
          function get_query_var($k,$d=''){return $d;}
          function is_singular(){return false;}
          function get_queried_object_id(){ $GLOBALS['queried_calls']++; throw new Exception('must not run on tax archive'); }
          function absint($v){return abs((int)$v);}
          function get_post_meta($id,$k,$single=true){return '';}
          require getcwd().'/includes/class-itkt-languages.php';
          $_SERVER['REQUEST_URI']='/product-category/baklava/';
          $code=ITKT_Languages::instance()->current_code();
          if($code!=='de'||$GLOBALS['queried_calls']!==0){exit(1);}
          echo "taxonomy recursion guard OK\n";
          PHP
          php /tmp/itkt-tax-test.php

      - name: Commit clean source
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-v0.12.24.yml
          git config user.name 'IT-Kayali'
          git config user.email 'ghaithkayali99@gmail.com'
          git add -A
          git commit -m 'fix: v0.12.24 prevent taxonomy language recursion [skip ci]'
          git push origin HEAD:main
